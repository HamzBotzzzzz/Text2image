<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Text To Image - Unlimited NSFW</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }

    .hero-header {
      position: relative;
      height: 100dvh;          
      min-height: 580px;
      background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.95)),
                  url('https://files.catbox.moe/vnvf2y.jpg') center/cover no-repeat;
      border-bottom: 8px solid #ff006e;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 80px;
    }

    .hero-header::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at center, transparent 15%, rgba(0,0,0,0.95) 100%);
    }

    .hero-title {
      text-align: center;
      z-index: 10;
    }

    .main-card {
      margin-top: -80px;    
      position: relative;
      z-index: 20;
    }

    .glass-card {
      background: rgba(20, 20, 40, 0.85);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 30px 80px rgba(0,0,0,0.9);
    }

    @media (max-width: 768px) {
      .hero-header {
        height: 100dvh;
        padding-bottom: 100px;
      }
      .main-card {
        margin-top: -60px;
      }
      .glass-card {
        margin-left: 10px;
        margin-right: 10px;
        border-radius: 20px;
      }
      .generate-btn {
        padding: 16px 40px !important;
        font-size: 1.1rem !important;
      }
    }
  </style>
</head>
<body>
  <div class="hero-header">
    <div class="hero-title">
      <h1 class="display-3 display-md-1 fw-bold mb-2" style="background: linear-gradient(45deg, #ff006e, #8338ec); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        Text To Image
      </h1>
      <p class="lead fw-bold fs-4">Unlimited • Free • Uncensored • 2025</p>
    </div>
  </div>

  <!-- CARD UTAMA -->
  <div class="container pb-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10">
        <div class="main-card glass-card p-4 p-md-5">
          <form id="generateForm">
            <div class="mb-4">
              <label class="form-label fw-bold fs-4">Prompt (Full NSFW Allowed)</label>
              <textarea class="form-control bg-dark border-0 text-light" id="prompt" rows="5"
                placeholder="beautiful nude girl, beach sunset, ultra detailed, 8k, photorealistic..."></textarea>
            </div>

            <div class="d-flex flex-wrap gap-2 mb-4">
              <button type="button" class="btn btn-sm btn-outline-primary" onclick="addEnhancer(', 8k, masterpiece, best quality')">8K</button>
              <button type="button" class="btn btn-sm btn-outline-danger" onclick="addEnhancer(', nude, uncensored, full body')">Nude</button>
              <button type="button" class="btn btn-sm btn-outline-warning" onclick="addEnhancer(', hentai, ahegao')">Hentai</button>
              <button type="button" class="btn btn-sm btn-outline-info" onclick="addEnhancer(', cyberpunk, neon')">Cyberpunk</button>
            </div>

            <div class="text-center">
              <button type="submit" class="btn generate-btn text-white">
                <i class="bi bi-stars me-2"></i>Generate Now
              </button>
            </div>
          </form>

          <div id="loading" class="text-center py-5 d-none">
            <div class="spinner-border text-pink" style="width:4rem;height:4rem;"></div>
            <p class="mt-3">Ai Rendering keindahan...</p>
          </div>

          <div id="result" class="text-center mt-5 d-none">
            <img id="generatedImage" class="img-fluid rounded-4 shadow" style="max-height:80vh;" alt="Hasil AI"/>
            <div class="mt-4">
              <a id="downloadBtn" class="btn btn-success btn-lg me-3" download>Download</a>
              <button onclick="copyImageUrl()" class="btn btn-outline-light btn-lg">Copy Link</button>
            </div>
          </div>

          <div id="error" class="alert alert-danger mt-4 d-none"></div>
        </div>
      </div>
    </div>
  </div>

<script>
async function generateImage() {
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) return alert('Prompt kosong!');

  document.getElementById('loading').classList.remove('d-none');
  document.getElementById('result').classList.add('d-none');
  document.getElementById('error').classList.add('d-none');

  const enhanced = prompt + ', photorealistic, ultra detailed, 8k, masterpiece, best quality, uncensored';
  const url = `https://pollinations.ai/p/${encodeURIComponent(enhanced)}?nologo=true`;

  const img = document.getElementById('generatedImage');
  const downloadBtn = document.getElementById('downloadBtn');

  img.src = url + '&t=' + Date.now();

  img.onload = () => {
    document.getElementById('loading').classList.add('d-none');
    document.getElementById('result').classList.remove('d-none');
    downloadBtn.href = url;
    downloadBtn.download = `ai_${Date.now()}.png`;
  };

  img.onerror = async () => {
    try {
      const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
      const res = await fetch(proxy);
      const blob = await res.blob();
      img.src = URL.createObjectURL(blob);
    } catch {
      document.getElementById('loading').classList.add('d-none');
      document.getElementById('error').classList.remove('d-none');
      document.getElementById('error').innerHTML = `Gagal load gambar. <a href="${url}" target="_blank">Buka manual</a>`;
    }
  };
}

document.getElementById('generateForm').onsubmit = e => {
  e.preventDefault();
  generateImage();
};

function addEnhancer(text) {
  document.getElementById('prompt').value += text;
}

function copyImageUrl() {
  const url = document.getElementById('downloadBtn').href;
  navigator.clipboard.writeText(url);
  alert('Link berhasil dicopy!');
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
