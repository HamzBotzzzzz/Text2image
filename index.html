<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text to Image - Unlimited Free NSFW</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --pink: #ff006e; --purple: #8338ec; }
    body { background: #000; color: white; font-family: 'Segoe UI', sans-serif; }
    .hero-header {
      height: 100dvh; min-height: 600px;
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.95)),
                  url('https://files.catbox.moe/vnvf2y.jpg') center/cover no-repeat;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 100px; border-bottom: 8px solid var(--pink);
    }
    .glass-card {
      background: rgba(20,20,40,0.9); backdrop-filter: blur(20px);
      border-radius: 28px; border: 1px solid rgba(255,255,255,0.1);
      margin: -80px 15px 0; position: relative; z-index: 10;
    }
    .generate-btn {
      background: linear-gradient(45deg, var(--pink), var(--purple));
      border: none; border-radius: 50px; padding: 16px 50px;
      font-size: 1.2rem; font-weight: bold;
    }
    .loading-spinner {
      width: 70px; height: 70px; border: 8px solid #333;
      border-top: 8px solid var(--pink); border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .image-result img {
      border-radius: 24px; box-shadow: 0 40px 80px rgba(0,0,0,0.95);
      max-height: 80vh; width: 100%;
    }
  </style>
</head>
<body>

<div class="hero-header">
  <div class="text-center">
    <h1 class="display-3 fw-bold mb-2" style="background: linear-gradient(45deg,var(--pink),var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
      Text To Image
    </h1>
    <p class="lead fw-bold">Unlimited · Free · Uncensored · 2025</p>
  </div>
</div>

<div class="container">
  <div class="glass-card p-4 p-md-5">
    <form id="form">
      <div class="mb-4">
        <label class="form-label fw-bold">Prompt (Full NSFW Allowed)</label>
        <textarea class="form-control bg-dark border-0 text-light" id="prompt" rows="5"
          placeholder="beautiful nude girl, ultra detailed, 8k, masterpiece..."></textarea>
      </div>

      <div class="d-flex flex-wrap gap-2 mb-4">
        <button type="button" class="btn btn-outline-primary btn-sm" onclick="addEnhancer(', masterpiece, best quality, ultra detailed, 8k')">8K</button>
        <button type="button" class="btn btn-outline-danger btn-sm" onclick="addEnhancer(', nude, uncensored, full body')">Nude</button>
        <button type="button" class="btn btn-outline-warning btn-sm" onclick="addEnhancer(', hentai, ahegao')">Hentai</button>
        <button type="button" class="btn btn-outline-info btn-sm" onclick="addEnhancer(', cyberpunk, neon rain')">Cyberpunk</button>
      </div>

      <div class="text-center">
        <button type="submit" class="btn generate-btn text-white">
          <i class="bi bi-stars me-2"></i>Generate Now
        </button>
      </div>
    </form>

    <div id="loading" class="text-center py-5 d-none">
      <div class="loading-spinner mx-auto"></div>
      <p class="mt-3">Sedang generate... (15-45 detik)</p>
    </div>

    <div id="result" class="text-center mt-5 d-none">
      <img id="img" class="image-result" alt="Hasil AI">
      <div class="mt-4">
        <a id="dl" class="btn btn-success btn-lg me-3" download>Download HD</a>
        <button class="btn btn-outline-light btn-lg" onclick="copyLink()">Copy Link</button>
      </div>
    </div>

    <div id="error" class="alert alert-danger mt-4 d-none"></div>
  </div>
</div>

<script>
// Direct no proxy - pakai endpoint image.pollinations.ai yang paling stabil
document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const prompt = document.getElementById("prompt").value.trim();
  if (!prompt) return alert("Prompt kosong!");

  const loading = document.getElementById("loading");
  const result = document.getElementById("result");
  const error = document.getElementById("error");
  const img = document.getElementById("img");
  const dl = document.getElementById("dl");

  result.classList.add("d-none");
  error.classList.add("d-none");
  loading.classList.remove("d-none");

  // Enhance prompt
  const fullPrompt = prompt + ", photorealistic, ultra detailed, 8k, masterpiece, best quality, uncensored";
  
  // Direct URL tanpa proxy - pakai image.pollinations.ai
  const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?model=flux&width=1024&height=1024&nologo=true`;

  // Set src langsung
  img.src = url + "&t=" + Date.now();

  img.onload = () => {
    loading.classList.add("d-none");
    result.classList.remove("d-none");
    dl.href = url;
    dl.download = `ai_image_${Date.now()}.png`;
  };

  img.onerror = () => {
    loading.classList.add("d-none");
    error.classList.remove("d-none");
    error.innerHTML = `
      <strong>Gagal load gambar!</strong><br>
      Mungkin server sibuk atau prompt terlalu kompleks.<br>
      <a href="${url}" target="_blank" class="btn btn-warning btn-sm mt-2">Buka Langsung di Pollinations</a>
    `;
  };
};

function addEnhancer(text) {
  document.getElementById("prompt").value += text;
  document.getElementById("prompt").focus();
}

function copyLink() {
  const url = document.getElementById("dl").href;
  navigator.clipboard.writeText(url).then(() => alert("Link berhasil dicopy!"));
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
