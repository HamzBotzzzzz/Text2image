<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text to Image - Unlimited Free NSFW</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --pink: #ff006e; --purple: #8338ec; }
    body { background: #000; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; }
    .hero-header {
      height: 100dvh; min-height: 600px;
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.95)),
                  url('https://files.catbox.moe/vnvf2y.jpg') center/cover no-repeat;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 100px; border-bottom: 8px solid var(--pink);
    }
    .glass-card {
      background: rgba(20,20,40,0.9); backdrop-filter: blur(20px);
      border-radius: 28px; border: 1px solid rgba(255,255,255,0.1);
      margin: -80px 15px 40px; position: relative; z-index: 10;
    }
    .generate-btn {
      background: linear-gradient(45deg, var(--pink), var(--purple));
      border: none; border-radius: 50px; padding: 16px 60px;
      font-size: 1.3rem; font-weight: bold; box-shadow: 0 10px 30px rgba(255,0,110,0.4);
    }
    .loading-spinner {
      width: 70px; height: 70px; border: 8px solid #333;
      border-top: 8px solid var(--pink); border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result-card {
      background: rgba(30,30,50,0.8); backdrop-filter: blur(15px);
      border-radius: 24px; border: 1px solid rgba(255,255,255,0.15);
      padding: 20px; margin-top: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    .result-card img {
      width: 100%; max-height: 75vh; object-fit: contain;
      border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.9);
    }
    @media (max-width: 768px) {
      .hero-header { padding-bottom: 80px; }
      .glass-card { margin: -60px 10px 20px; }
    }
  </style>
</head>
<body>

<div class="hero-header">
  <div class="text-center">
    <h1 class="display-3 fw-bold mb-2" style="background: linear-gradient(45deg,var(--pink),var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
      Text To Image
    </h1>
    <p class="lead fw-bold">Unlimited · Free · Uncensored · 2025</p>
  </div>
</div>

<div class="container">
  <div class="glass-card p-4 p-md-5">
    <form id="form">
      <div class="mb-4">
        <label class="form-label fw-bold fs-4">Prompt (Full NSFW Allowed)</label>
        <textarea class="form-control bg-dark border-0 text-light" id="prompt" rows="5"
          placeholder="beautiful nude girl, ultra detailed, 8k, masterpiece..."></textarea>
      </div>

      <div class="d-flex flex-wrap gap-2 mb-4">
        <button type="button" class="btn btn-sm btn-outline-primary" onclick="add(', 8k, masterpiece, best quality')">8K</button>
        <button type="button" class="btn btn-sm btn-outline-danger" onclick="add(', nude, uncensored, full body')">Nude</button>
        <button type="button" class="btn btn-sm btn-outline-warning" onclick="add(', hentai, ahegao')">Hentai</button>
        <button type="button" class="btn btn-sm btn-outline-info" onclick="add(', cyberpunk, neon')">Cyberpunk</button>
      </div>

      <div class="text-center">
        <button type="submit" class="btn generate-btn text-white">
          Generate Now
        </button>
      </div>
    </form>

    <div id="loading" class="text-center py-5 d-none">
      <div class="loading-spinner mx-auto"></div>
      <p class="mt-3 fs-5">Sedang merender...</p>
    </div>

    <div id="result" class="d-none">
      <div class="result-card">
        <img id="generatedImage" class="w-100" alt="Hasil AI">
        <div class="text-center mt-4">
          <a id="downloadBtn" class="btn btn-success btn-lg px-5 me-3" download>Download HD</a>
          <button onclick="copyLink()" class="btn btn-outline-light btn-lg">Copy Link</button>
        </div>
        <small class="d-block mt-3 text-success">Generated with Pollinations AI • Unlimited • No Watermark</small>
      </div>
    </div>

    <div id="error" class="alert alert-danger mt-4 d-none"></div>
  </div>
</div>

<script>
document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const prompt = document.getElementById("prompt").value.trim();
  if (!prompt) return alert("Prompt kosong!");

  document.getElementById("loading").classList.remove("d-none");
  document.getElementById("result").classList.add("d-none");
  document.getElementById("error").classList.add("d-none");

  const fullPrompt = prompt + ", photorealistic, ultra detailed, 8k, masterpiece, best quality, uncensored, sharp focus";
  
  // ehh apa ni
  const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(fullPrompt) + 
              "?model=flux&width=1024&height=1024&nologo=true&seed=" + Date.now();

  const img = document.getElementById("generatedImage");
  const downloadBtn = document.getElementById("downloadBtn");

  img.src = url;

  img.onload = () => {
    document.getElementById("loading").classList.add("d-none");
    document.getElementById("result").classList.remove("d-none");
    downloadBtn.href = url;
    downloadBtn.download = "ai_" + Date.now() + ".png";
  };

  img.onerror = () => {
    document.getElementById("loading").classList.add("d-none");
    document.getElementById("error").classList.remove("d-none");
    document.getElementById("error").innerHTML = `
      <strong>Gagal load gambar!</strong><br>
      <a href="${url}" target="_blank" class="btn btn-warning btn-sm">Buka Manual</a>
    `;
  };
};

function add(text) {
  document.getElementById("prompt").value += text;
}

function copyLink() {
  navigator.clipboard.writeText(document.getElementById("downloadBtn").href);
  alert("Link disalin!");
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
