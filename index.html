<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text to Image - Unlimited Free NSFW</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --pink: #ff006e; --purple: #8338ec; }
    body { background: #000; color: white; font-family: 'Segoe UI', sans-serif; }
    .hero-header {
      height: 100dvh; min-height: 600px;
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.95)),
                  url('https://files.catbox.moe/vnvf2y.jpg') center/cover no-repeat;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 100px; border-bottom: 8px solid var(--pink);
    }
    .glass-card {
      background: rgba(20,20,40,0.9); backdrop-filter: blur(20px);
      border-radius: 28px; border: 1px solid rgba(255,255,255,0.1);
      margin: -80px 15px 0; position: relative; z-index: 10;
    }
    .generate-btn {
      background: linear-gradient(45deg, var(--pink), var(--purple));
      border: none; border-radius: 50px; padding: 16px 50px;
      font-size: 1.2rem; font-weight: bold;
    }
    .loading-spinner {
      width: 70px; height: 70px; border: 8px solid #333;
      border-top: 8px solid var(--pink); border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* STYLE BARU UNTUK CARD RESULT */
    .result-card {
      background: rgba(15,15,35,0.95); backdrop-filter: blur(15px);
      border-radius: 20px; border: 1px solid rgba(255,255,255,0.08);
      padding: 25px; margin-top: 30px; max-width: 800px;
      margin-left: auto; margin-right: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }
    .result-image img {
      border-radius: 16px; width: 100%; max-height: 70vh;
      object-fit: contain; display: block; margin: 0 auto;
    }
    .result-buttons {
      margin-top: 25px; display: flex; justify-content: center;
      flex-wrap: wrap; gap: 15px;
    }
    /* END STYLE BARU */
    
    /* Style untuk placeholder yang lebih jelas */
    textarea::placeholder {
      color: rgba(255, 255, 255, 0.4);
      font-style: italic;
    }
    
    /* Style untuk button enhancer */
    .enhancer-btn {
      transition: all 0.2s ease;
    }
    .enhancer-btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<div class="hero-header">
  <div class="text-center">
    <h1 class="display-3 fw-bold mb-2" style="background: linear-gradient(45deg,var(--pink),var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
      Text To Image
    </h1>
    <p class="lead fw-bold">Unlimited · Free · Uncensored · 2025</p>
  </div>
</div>

<div class="container">
  <div class="glass-card p-4 p-md-5">
    <form id="form">
      <div class="mb-4">
        <label class="form-label fw-bold">Prompt (Full NSFW Allowed)</label>
        <!-- TEXTAREA DIKOSONGKAN (placeholder only) -->
        <textarea class="form-control bg-dark border-0 text-light" id="prompt" rows="5"
          placeholder="Masukkan prompt AI di sini... Contoh: beautiful woman, ultra detailed, 8k masterpiece, etc."></textarea>
        <div class="form-text text-light opacity-75 mt-1">
          Ketik prompt apa saja. Gunakan tombol di bawah untuk menambahkan keyword.
        </div>
      </div>

      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="fw-bold">Quick Enhancers:</span>
          <button type="button" class="btn btn-sm btn-outline-secondary" onclick="clearPrompt()">
            <i class="bi bi-eraser me-1"></i>Clear Prompt
          </button>
        </div>
        <div class="d-flex flex-wrap gap-2">
          <button type="button" class="btn btn-outline-primary btn-sm enhancer-btn" onclick="addEnhancer(', masterpiece, best quality, ultra detailed, 8k')">8K Ultra</button>
          <button type="button" class="btn btn-outline-danger btn-sm enhancer-btn" onclick="addEnhancer(', nude, uncensored, full body')">Nude</button>
          <button type="button" class="btn btn-outline-warning btn-sm enhancer-btn" onclick="addEnhancer(', hentai, ahegao, anime')">Hentai</button>
          <button type="button" class="btn btn-outline-info btn-sm enhancer-btn" onclick="addEnhancer(', cyberpunk, neon rain, futuristic')">Cyberpunk</button>
          <button type="button" class="btn btn-outline-success btn-sm enhancer-btn" onclick="addEnhancer(', photorealistic, realistic, detailed skin')">Photorealistic</button>
          <button type="button" class="btn btn-outline-light btn-sm enhancer-btn" onclick="addEnhancer(', natural lighting, cinematic, dramatic')">Cinematic</button>
        </div>
      </div>

      <div class="text-center">
        <button type="submit" class="btn generate-btn text-white">
          <i class="bi bi-stars me-2"></i>Generate Now
        </button>
      </div>
    </form>

    <div id="loading" class="text-center py-5 d-none">
      <div class="loading-spinner mx-auto"></div>
      <p class="mt-3">Sedang generate... (15-45 detik)</p>
    </div>

    <!-- ERROR TETAP DI DALAM GLASS-CARD -->
    <div id="error" class="alert alert-danger mt-4 d-none"></div>
  </div>

  <!-- CARD BARU KHUSUS UNTUK HASIL - DI LUAR GLASS-CARD UTAMA -->
  <div id="result" class="d-none">
    <div class="result-card">
      <div class="result-image">
        <img id="img" alt="Hasil AI">
      </div>
      <div class="result-buttons">
        <a id="dl" class="btn btn-success btn-lg px-4" download>
          <i class="bi bi-download me-2"></i>Download HD
        </a>
        <button class="btn btn-outline-light btn-lg px-4" onclick="copyLink()">
          <i class="bi bi-link-45deg me-2"></i>Copy Link
        </button>
      </div>
    </div>
  </div>
</div>

<script>
// Direct no proxy - pakai endpoint image.pollinations.ai yang paling stabil
document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const prompt = document.getElementById("prompt").value.trim();
  if (!prompt) {
    alert("Mohon masukkan prompt terlebih dahulu!");
    document.getElementById("prompt").focus();
    return;
  }

  const loading = document.getElementById("loading");
  const result = document.getElementById("result");
  const error = document.getElementById("error");
  const img = document.getElementById("img");
  const dl = document.getElementById("dl");

  result.classList.add("d-none");
  error.classList.add("d-none");
  loading.classList.remove("d-none");

  // Enhance prompt dengan tambahan default
  const fullPrompt = prompt + ", photorealistic, ultra detailed, 8k, masterpiece, best quality, uncensored";
  
  // Direct URL tanpa proxy - pakai image.pollinations.ai
  const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?model=flux&width=1024&height=1024&nologo=true`;

  // Set src langsung
  img.src = url + "&t=" + Date.now();

  img.onload = () => {
    loading.classList.add("d-none");
    result.classList.remove("d-none");
    dl.href = url;
    dl.download = `ai_image_${Date.now()}.png`;
    
    // Scroll ke hasil
    result.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  img.onerror = () => {
    loading.classList.add("d-none");
    error.classList.remove("d-none");
    error.innerHTML = `
      <strong>Gagal load gambar!</strong><br>
      Mungkin server sibuk atau prompt terlalu kompleks.<br>
      <a href="${url}" target="_blank" class="btn btn-warning btn-sm mt-2">Buka Langsung di Pollinations</a>
    `;
  };
};

function addEnhancer(text) {
  const textarea = document.getElementById("prompt");
  const cursorPos = textarea.selectionStart;
  const currentValue = textarea.value;
  
  // Jika textarea kosong, langsung tambahkan text tanpa koma di awal
  if (currentValue.trim() === '') {
    textarea.value = text.replace(/^,\s*/, '');
  } else {
    // Jika ada teks, tambahkan dengan koma dan spasi
    const beforeCursor = currentValue.substring(0, cursorPos);
    const afterCursor = currentValue.substring(cursorPos);
    
    // Cek apakah sebelum kursor sudah ada koma
    if (beforeCursor.trim() !== '' && !beforeCursor.endsWith(',') && !beforeCursor.endsWith(' ')) {
      textarea.value = beforeCursor + ', ' + text + afterCursor;
      textarea.selectionStart = textarea.selectionEnd = cursorPos + text.length + 2;
    } else {
      textarea.value = beforeCursor + text + afterCursor;
      textarea.selectionStart = textarea.selectionEnd = cursorPos + text.length;
    }
  }
  
  textarea.focus();
}

function clearPrompt() {
  document.getElementById("prompt").value = '';
  document.getElementById("prompt").focus();
}

function copyLink() {
  const url = document.getElementById("dl").href;
  navigator.clipboard.writeText(url).then(() => {
    const btn = event.target.closest('button');
    const originalHTML = btn.innerHTML;
    btn.innerHTML = '<i class="bi bi-check2 me-2"></i>Link Copied!';
    btn.classList.replace('btn-outline-light', 'btn-success');
    setTimeout(() => {
      btn.innerHTML = originalHTML;
      btn.classList.replace('btn-success', 'btn-outline-light');
    }, 2000);
  });
}

// Fokus ke textarea saat halaman dimuat
window.onload = function() {
  document.getElementById("prompt").focus();
};
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
